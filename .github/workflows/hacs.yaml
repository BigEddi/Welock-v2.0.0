name: HACS Action

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Lizenz: Original-Repo (hzjchina/hass-welock) hat keine Lizenz - Antwort des Autors abwarten.
          # Topics: werden im GitHub-"About"-Bereich gepflegt.
          ignore: "license topics"
